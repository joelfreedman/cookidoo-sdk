[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cookidoo-sdk"
version = "0.1.0"
description = "Unofficial Python SDK for Cookidoo Thermomix recipe platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "playwright>=1.44.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0"
]

[project.scripts]
cookidoo = "cookidoo.cli:main"

[tool.setuptools.packages.find]
include = ["cookidoo*"]
